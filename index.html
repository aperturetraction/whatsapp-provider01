<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhatsApp Provider - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #07110d;
            color: #111827;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 25px;
        }

        /* Logo / Brand */

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .brand-logo {
            width: 60px;
            height: 60px;

            margin: 0 auto 15px;

            border-radius: 16px;

            background: #19c37d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            font-weight: bold;

            box-shadow: 0 10px 30px rgba(25,195,125,0.25);
        }

        .brand h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .brand p {
            color: #9ca3af;
            font-size: 14px;
        }

        /* Login Card */

        .login-card {
            background: white;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.30);
        }

        .login-card h2 {
            font-size: 22px;
            margin-bottom: 25px;
        }

        /* Labels */

        .login-card label {
            display: block;

            margin-top: 16px;
            margin-bottom: 7px;

            font-size: 14px;
            font-weight: bold;
        }

        /* Input */

        .login-card input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        .login-card input:focus {
            border-color: #19c37d;

            box-shadow:
                0 0 0 3px rgba(25,195,125,0.12);
        }

        /* Buttons */

        .btn-primary {
            width: 100%;

            padding: 13px;

            border-radius: 9px;

            border: none;

            margin-top: 20px;

            cursor: pointer;

            font-size: 15px;
            font-weight: bold;

            transition: 0.2s;

            background: #19c37d;
            color: white;
        }

        .btn-primary:hover {
            background: #14a96b;
        }

        /* Links */

        .login-links {
            text-align: center;

            margin-top: 18px;

            font-size: 13px;

            color: #16a36a;
        }

        .login-links a {
            color: #16a36a;
            text-decoration: none;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        /* Copyright */

        .copyright {
            text-align: center;

            color: #6b7280;

            margin-top: 20px;

            font-size: 12px;
        }

        /* Mobile */

        @media (max-width: 480px) {

            .login-container {
                padding: 18px;
            }

            .login-card {
                padding: 24px;
            }

            .brand h1 {
                font-size: 22px;
            }

        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- BRAND -->

        <div class="brand">

            <div class="brand-logo">
                W
            </div>

            <h1>
                WhatsApp Provider
            </h1>

            <p>
                Manage your WhatsApp business accounts
            </p>

        </div>


        <!-- LOGIN CARD -->

        <div class="login-card">

            <h2>
                Sign in
            </h2>


            <!-- LOGIN FORM -->

            <form onsubmit="login(event)">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                >


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Sign In
                </button>

            </form>


            <!-- ACCOUNT LINKS -->

            <div class="login-links">

                <a href="#">
                    Forgot Password?
                </a>

                <br><br>

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>


        <!-- COPYRIGHT -->

        <p class="copyright">
            © 2026 WhatsApp Provider
        </p>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        /*
         * LOGIN
         *
         * 目前只是前端测试登录。
         *
         * 下一阶段会改成：
         *
         * Customer
         * ↓
         * Cloudflare Worker
         * ↓
         * D1 Database
         * ↓
         * Password Verification
         * ↓
         * Session
         * ↓
         * Dashboard
         */

        function login(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;


            /*
             * 暂时保存登录资料，
             * 下一步会改成真正的 D1 Login。
             */

            localStorage.setItem(
                "userEmail",
                email
            );

            localStorage.setItem(
                "loggedIn",
                "true"
            );


            /*
             * 登录成功后进入 Dashboard
             */

            window.location.href =
                "dashboard.html";
        }

    </script>

</body>
</html>
