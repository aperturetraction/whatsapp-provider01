<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — ChatNova</title>
    <meta name="description" content="Login to your ChatNova WhatsApp Business dashboard.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #070909;
            --bg-soft: #0b0f0e;
            --card: #101513;
            --card-2: #131a17;
            --border: rgba(255,255,255,0.09);
            --text: #f5f7f6;
            --muted: #8e9994;
            --green: #19d47b;
            --green-dark: #0fae62;
            --danger: #ff5f6d;
            --warning: #f5c451;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(25,212,123,0.10),
                    transparent 35%
                ),
                var(--bg);
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 42px;
            border-bottom: 1px solid var(--border);
            background: rgba(7,9,9,0.82);
            backdrop-filter: blur(16px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.4px;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(25,212,123,0.12);
            border: 1px solid rgba(25,212,123,0.28);
            color: var(--green);
            font-size: 17px;
            font-weight: 900;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .home-link {
            color: var(--muted);
            font-size: 14px;
            transition: 0.2s;
        }

        .home-link:hover {
            color: var(--text);
        }

        .language {
            display: flex;
            gap: 5px;
            padding: 4px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.025);
        }

        .lang-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 6px 9px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .lang-btn.active {
            color: #06110b;
            background: var(--green);
            font-weight: 700;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .login-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-heading h1 {
            font-size: 34px;
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .login-heading p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .login-card {
            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.025),
                    rgba(255,255,255,0.01)
                ),
                var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            box-shadow:
                0 30px 80px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.025);
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #dfe6e2;
            font-size: 13px;
            font-weight: 600;
        }

        .input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.10);
            background: #090d0c;
            color: var(--text);
            outline: none;
            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .input::placeholder {
            color: #5f6a65;
        }

        .input:focus {
            border-color: rgba(25,212,123,0.60);
            box-shadow: 0 0 0 3px rgba(25,212,123,0.08);
        }

        .password-row {
            position: relative;
        }

        .password-row .input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 11px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
            padding: 7px;
        }

        .show-password:hover {
            color: var(--green);
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: -3px 0 22px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        .remember input {
            accent-color: var(--green);
        }

        .forgot {
            color: var(--green);
            font-size: 12px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* =========================
           BUTTON
        ========================= */

        .btn {
            width: 100%;
            height: 51px;
            border: 0;
            border-radius: 11px;
            cursor: pointer;
            font-weight: 750;
            font-size: 14px;
            transition:
                transform 0.15s,
                opacity 0.2s,
                background 0.2s;
        }

        .btn-primary {
            background: var(--green);
            color: #041009;
        }

        .btn-primary:hover {
            background: #24e284;
            transform: translateY(-1px);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 13px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(255,95,109,0.08);
            border: 1px solid rgba(255,95,109,0.22);
            color: #ff9da6;
        }

        .message.success {
            background: rgba(25,212,123,0.08);
            border: 1px solid rgba(25,212,123,0.22);
            color: #70e8ad;
        }

        .message.warning {
            background: rgba(245,196,81,0.08);
            border: 1px solid rgba(245,196,81,0.22);
            color: #f5d47c;
        }

        /* =========================
           DIVIDER
        ========================= */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #5e6964;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--border);
        }

        /* =========================
           REGISTER
        ========================= */

        .register-text {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .register-link {
            color: var(--green);
            font-weight: 700;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        /* =========================
           SECURITY
        ========================= */

        .security {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-top: 22px;
            color: #69736f;
            font-size: 11px;
            text-align: center;
        }

        .security-icon {
            color: var(--green);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 20px;
            text-align: center;
            color: #535d59;
            font-size: 11px;
        }

        /* =========================
           LOADING
        ========================= */

        .spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-right: 7px;
            vertical-align: -3px;
            border: 2px solid rgba(0,0,0,0.25);
            border-top-color: #06110b;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                height: 68px;
                padding: 0 18px;
            }

            .brand {
                font-size: 18px;
            }

            .brand-mark {
                width: 31px;
                height: 31px;
                border-radius: 9px;
            }

            .home-link {
                display: none;
            }

            main {
                padding: 38px 16px;
                align-items: flex-start;
            }

            .login-heading {
                margin-top: 12px;
                margin-bottom: 23px;
            }

            .login-heading h1 {
                font-size: 29px;
            }

            .login-card {
                padding: 23px 19px;
                border-radius: 17px;
            }

            .form-options {
                align-items: flex-start;
            }

            .forgot {
                white-space: nowrap;
            }

            footer {
                padding-bottom: 25px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- HEADER -->
    <header>

        <a href="index.html" class="brand">
            <div class="brand-mark">C</div>
            <span>ChatNova</span>
        </a>

        <div class="header-right">

            <a href="index.html" class="home-link" data-i18n="backHome">
                ← Back to home
            </a>

            <div class="language">
                <button
                    type="button"
                    class="lang-btn active"
                    id="langEN"
                    onclick="setLanguage('en')">
                    EN
                </button>

                <button
                    type="button"
                    class="lang-btn"
                    id="langZH"
                    onclick="setLanguage('zh')">
                    中文
                </button>
            </div>

        </div>

    </header>


    <!-- MAIN -->
    <main>

        <div class="login-wrapper">

            <div class="login-heading">

                <h1 data-i18n="title">
                    Welcome back
                </h1>

                <p data-i18n="subtitle">
                    Sign in to manage your WhatsApp Business accounts.
                </p>

            </div>


            <div class="login-card">

                <!-- MESSAGE -->
                <div
                    id="message"
                    class="message">
                </div>


                <!-- LOGIN FORM -->
                <form id="loginForm">

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="email"
                            data-i18n="emailLabel">
                            Email address
                        </label>

                        <input
                            id="email"
                            class="input"
                            type="email"
                            autocomplete="email"
                            placeholder="you@example.com"
                            required>

                    </div>


                    <div class="form-group">

                        <label
                            class="form-label"
                            for="password"
                            data-i18n="passwordLabel">
                            Password
                        </label>

                        <div class="password-row">

                            <input
                                id="password"
                                class="input"
                                type="password"
                                autocomplete="current-password"
                                placeholder="Enter your password"
                                required>

                            <button
                                type="button"
                                class="show-password"
                                id="showPassword"
                                onclick="togglePassword()"
                                data-i18n="show">
                                Show
                            </button>

                        </div>

                    </div>


                    <div class="form-options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="remember">

                            <span data-i18n="remember">
                                Remember me
                            </span>

                        </label>

                        <a
                            href="#"
                            class="forgot"
                            onclick="forgotPassword(event)"
                            data-i18n="forgot">
                            Forgot password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="loginButton"
                        data-i18n="signIn">
                        Sign in
                    </button>

                </form>


                <div class="divider" data-i18n="or">
                    OR
                </div>


                <div class="register-text">

                    <span data-i18n="noAccount">
                        Don't have an account?
                    </span>

                    &nbsp;

                    <a
                        href="register.html"
                        class="register-link"
                        data-i18n="createAccount">
                        Create account
                    </a>

                </div>


                <div class="security">

                    <span class="security-icon">✓</span>

                    <span data-i18n="security">
                        Secure account authentication
                    </span>

                </div>

            </div>

        </div>

    </main>


    <footer>
        © 2026 ChatNova. All rights reserved.
    </footer>

</div>


<script>

    /* =====================================================
       CHATNOVA CONFIG
    ===================================================== */

    const API_BASE =
        "https://whatsapp-provider-api.b79gn827py.workers.dev";

    const TOKEN_KEY = "chatnova_token";
    const USER_KEY = "chatnova_user";
    const LANGUAGE_KEY = "chatnova_language";


    /* =====================================================
       TRANSLATIONS
    ===================================================== */

    const translations = {

        en: {
            backHome: "← Back to home",
            title: "Welcome back",
            subtitle: "Sign in to manage your WhatsApp Business accounts.",
            emailLabel: "Email address",
            passwordLabel: "Password",
            show: "Show",
            hide: "Hide",
            remember: "Remember me",
            forgot: "Forgot password?",
            signIn: "Sign in",
            signingIn: "Signing in...",
            or: "OR",
            noAccount: "Don't have an account?",
            createAccount: "Create account",
            security: "Secure account authentication",

            invalidLogin:
                "Invalid email or password.",

            connectionError:
                "Unable to connect to ChatNova. Please try again.",

            sessionError:
                "Login succeeded, but the session could not be verified.",

            success:
                "Login successful. Redirecting...",

            forgotMessage:
                "Password recovery will be available soon."
        },

        zh: {
            backHome: "← 返回首页",
            title: "欢迎回来",
            subtitle: "登录以管理您的 WhatsApp Business 账号。",
            emailLabel: "电子邮件地址",
            passwordLabel: "密码",
            show: "显示",
            hide: "隐藏",
            remember: "记住我",
            forgot: "忘记密码？",
            signIn: "登录",
            signingIn: "登录中...",
            or: "或",
            noAccount: "还没有账号？",
            createAccount: "创建账号",
            security: "安全账号认证",

            invalidLogin:
                "电子邮件或密码错误。",

            connectionError:
                "无法连接 ChatNova，请稍后再试。",

            sessionError:
                "登录成功，但无法验证登录会话。",

            success:
                "登录成功，正在进入 Dashboard...",

            forgotMessage:
                "密码恢复功能即将开放。"
        }

    };


    /* =====================================================
       LANGUAGE
    ===================================================== */

    let currentLanguage =
        localStorage.getItem(LANGUAGE_KEY) || "en";


    function setLanguage(language) {

        currentLanguage = language;

        localStorage.setItem(
            LANGUAGE_KEY,
            language
        );

        applyLanguage();
    }


    function applyLanguage() {

        const t =
            translations[currentLanguage];

        document
            .querySelectorAll("[data-i18n]")
            .forEach(element => {

                const key =
                    element.getAttribute("data-i18n");

                if (t[key]) {
                    element.textContent = t[key];
                }

            });


        document
            .getElementById("langEN")
            .classList.toggle(
                "active",
                currentLanguage === "en"
            );


        document
            .getElementById("langZH")
            .classList.toggle(
                "active",
                currentLanguage === "zh"
            );


        document.documentElement.lang =
            currentLanguage === "zh"
                ? "zh"
                : "en";
    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showMessage(
        message,
        type = "error"
    ) {

        const box =
            document.getElementById("message");

        box.textContent = message;

        box.className =
            "message show " + type;
    }


    function hideMessage() {

        const box =
            document.getElementById("message");

        box.className = "message";

        box.textContent = "";
    }


    /* =====================================================
       PASSWORD VISIBILITY
    ===================================================== */

    function togglePassword() {

        const input =
            document.getElementById("password");

        const button =
            document.getElementById("showPassword");

        const t =
            translations[currentLanguage];


        if (input.type === "password") {

            input.type = "text";

            button.textContent =
                t.hide;

        } else {

            input.type = "password";

            button.textContent =
                t.show;
        }
    }


    /* =====================================================
       TIMEOUT FETCH
    ===================================================== */

    async function fetchWithTimeout(
        url,
        options = {},
        timeout = 15000
    ) {

        const controller =
            new AbortController();

        const timer =
            setTimeout(
                () => controller.abort(),
                timeout
            );

        try {

            const response =
                await fetch(
                    url,
                    {
                        ...options,
                        signal:
                            controller.signal
                    }
                );

            return response;

        } finally {

            clearTimeout(timer);
        }
    }


    /* =====================================================
       LOGIN
    ===================================================== */

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                hideMessage();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const remember =
                    document
                        .getElementById("remember")
                        .checked;


                const button =
                    document
                        .getElementById("loginButton");


                if (!email || !password) {
                    return;
                }


                button.disabled = true;

                button.innerHTML =
                    '<span class="spinner"></span>' +
                    translations[currentLanguage].signingIn;


                try {

                    /* -----------------------------------------
                       STEP 1
                       LOGIN
                    ----------------------------------------- */

                    const loginResponse =
                        await fetchWithTimeout(

                            API_BASE + "/api/login",

                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",

                                    "Accept":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    email: email,

                                    password: password

                                })
                            },

                            15000
                        );


                    let loginData = null;

                    try {
                        loginData =
                            await loginResponse.json();
                    } catch {
                        loginData = null;
                    }


                    if (
                        !loginResponse.ok ||
                        !loginData ||
                        !loginData.success
                    ) {

                        throw new Error(
                            "LOGIN_FAILED"
                        );
                    }


                    /* -----------------------------------------
                       STEP 2
                       GET TOKEN
                    ----------------------------------------- */

                    const token =
                        loginData.token;


                    if (
                        !token ||
                        typeof token !== "string"
                    ) {

                        throw new Error(
                            "NO_TOKEN"
                        );
                    }


                    /* -----------------------------------------
                       STEP 3
                       SAVE TOKEN
                    ----------------------------------------- */

                    /*
                     * The token is required for all authenticated
                     * ChatNova API requests.
                     */

                    localStorage.setItem(
                        TOKEN_KEY,
                        token
                    );


                    /* -----------------------------------------
                       STEP 4
                       VERIFY /api/me
                    ----------------------------------------- */

                    const meResponse =
                        await fetchWithTimeout(

                            API_BASE + "/api/me",

                            {
                                method: "GET",

                                headers: {

                                    "Accept":
                                        "application/json",

                                    "Authorization":
                                        "Bearer " + token
                                }
                            },

                            10000
                        );


                    let meData = null;

                    try {
                        meData =
                            await meResponse.json();
                    } catch {
                        meData = null;
                    }


                    if (
                        !meResponse.ok ||
                        !meData ||
                        !meData.success
                    ) {

                        /*
                         * Token is invalid or could not
                         * be verified.
                         */

                        localStorage.removeItem(
                            TOKEN_KEY
                        );

                        throw new Error(
                            "SESSION_FAILED"
                        );
                    }


                    /* -----------------------------------------
                       STEP 5
                       SAVE USER DATA
                    ----------------------------------------- */

                    if (meData.customer) {

                        localStorage.setItem(
                            USER_KEY,
                            JSON.stringify(
                                meData.customer
                            )
                        );

                    } else if (meData.user) {

                        localStorage.setItem(
                            USER_KEY,
                            JSON.stringify(
                                meData.user
                            )
                        );
                    }


                    /* -----------------------------------------
                       STEP 6
                       REMEMBER ME
                    ----------------------------------------- */

                    if (!remember) {

                        /*
                         * The authentication token is still kept
                         * for the current browser session because
                         * ChatNova currently uses localStorage.
                         *
                         * This checkbox is prepared for the
                         * future session-expiry enhancement.
                         */

                    }


                    /* -----------------------------------------
                       SUCCESS
                    ----------------------------------------- */

                    showMessage(
                        translations[currentLanguage].success,
                        "success"
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "dashboard.html";

                        },
                        500
                    );

                } catch (error) {

                    console.error(
                        "ChatNova login error:",
                        error
                    );


                    localStorage.removeItem(
                        TOKEN_KEY
                    );


                    if (
                        error.message ===
                        "LOGIN_FAILED"
                    ) {

                        showMessage(
                            translations[currentLanguage]
                                .invalidLogin,
                            "error"
                        );

                    } else if (
                        error.message ===
                        "SESSION_FAILED"
                    ) {

                        showMessage(
                            translations[currentLanguage]
                                .sessionError,
                            "error"
                        );

                    } else if (
                        error.message ===
                        "NO_TOKEN"
                    ) {

                        showMessage(
                            translations[currentLanguage]
                                .sessionError,
                            "error"
                        );

                    } else {

                        showMessage(
                            translations[currentLanguage]
                                .connectionError,
                            "error"
                        );
                    }


                    button.disabled = false;

                    button.textContent =
                        translations[currentLanguage]
                            .signIn;
                }

            }
        );


    /* =====================================================
       FORGOT PASSWORD
    ===================================================== */

    function forgotPassword(event) {

        event.preventDefault();

        showMessage(
            translations[currentLanguage]
                .forgotMessage,
            "warning"
        );
    }


    /* =====================================================
       AUTO REDIRECT IF ALREADY LOGGED IN
    ===================================================== */

    async function checkExistingSession() {

        const token =
            localStorage.getItem(TOKEN_KEY);


        if (!token) {
            return;
        }


        try {

            const response =
                await fetchWithTimeout(

                    API_BASE + "/api/me",

                    {
                        method: "GET",

                        headers: {

                            "Accept":
                                "application/json",

                            "Authorization":
                                "Bearer " + token
                        }
                    },

                    8000
                );


            if (!response.ok) {

                localStorage.removeItem(
                    TOKEN_KEY
                );

                localStorage.removeItem(
                    USER_KEY
                );

                return;
            }


            const data =
                await response.json();


            if (
                data &&
                data.success
            ) {

                if (data.customer) {

                    localStorage.setItem(
                        USER_KEY,
                        JSON.stringify(
                            data.customer
                        )
                    );

                }

                window.location.href =
                    "dashboard.html";
            }

        } catch (error) {

            /*
             * Do not block the login page if the API
             * is temporarily unavailable.
             */

            console.warn(
                "Existing session check skipped:",
                error
            );
        }
    }


    /* =====================================================
       INITIALIZE
    ===================================================== */

    applyLanguage();

    checkExistingSession();

</script>

</body>
</html>
