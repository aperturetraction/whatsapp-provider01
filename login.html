<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Login — ChatNova</title>

    <meta
        name="description"
        content="Login to your ChatNova WhatsApp Business dashboard."
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #070909;
            --card: #101513;
            --border: rgba(255,255,255,0.09);
            --text: #f5f7f6;
            --muted: #8e9994;
            --green: #19d47b;
            --green-hover: #24e284;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(25,212,123,0.10),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            overflow-x: hidden;

            -webkit-text-size-adjust: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            width: 100%;
            min-height: 76px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 42px;

            border-bottom: 1px solid var(--border);

            background: rgba(7,9,9,0.88);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 11px;

            font-weight: 800;
            font-size: 20px;

            letter-spacing: -0.4px;

            white-space: nowrap;
        }

        .brand-mark {
            width: 34px;
            height: 34px;

            flex: 0 0 34px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(25,212,123,0.12);

            border: 1px solid rgba(25,212,123,0.28);

            color: var(--green);

            font-size: 17px;
            font-weight: 900;
        }

        .header-right {
            display: flex;
            align-items: center;

            gap: 18px;

            min-width: 0;
        }

        .home-link {
            color: var(--muted);

            font-size: 14px;

            white-space: nowrap;

            transition: color 0.2s;
        }

        .home-link:hover {
            color: var(--text);
        }


        /* =====================================================
           LANGUAGE
        ===================================================== */

        .language {
            display: flex;

            gap: 4px;

            padding: 4px;

            border-radius: 9px;

            border: 1px solid var(--border);

            background: rgba(255,255,255,0.025);

            flex-shrink: 0;
        }

        .lang-btn {
            border: 0;

            background: transparent;

            color: var(--muted);

            padding: 6px 9px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 12px;

            transition:
                background 0.2s,
                color 0.2s;
        }

        .lang-btn.active {
            color: #06110b;

            background: var(--green);

            font-weight: 700;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {
            width: 100%;

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 60px 20px;
        }

        .login-wrapper {
            width: 100%;

            max-width: 430px;
        }


        /* =====================================================
           HEADING
        ===================================================== */

        .login-heading {
            width: 100%;

            text-align: center;

            margin-bottom: 28px;
        }

        .login-heading h1 {
            font-size: 34px;

            line-height: 1.15;

            letter-spacing: -1px;

            margin-bottom: 10px;
        }

        .login-heading p {
            color: var(--muted);

            font-size: 14px;

            line-height: 1.6;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .login-card {
            width: 100%;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.025),
                    rgba(255,255,255,0.01)
                ),
                var(--card);

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 32px;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.025);
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {
            width: 100%;

            margin-bottom: 20px;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            color: #dfe6e2;

            font-size: 13px;

            font-weight: 600;
        }

        .input {
            display: block;

            width: 100%;

            max-width: 100%;

            height: 50px;

            padding: 0 15px;

            border-radius: 11px;

            border: 1px solid rgba(255,255,255,0.10);

            background: #090d0c;

            color: var(--text);

            outline: none;

            -webkit-appearance: none;
            appearance: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .input::placeholder {
            color: #5f6a65;
        }

        .input:focus {
            border-color: rgba(25,212,123,0.60);

            box-shadow:
                0 0 0 3px rgba(25,212,123,0.08);
        }


        /* =====================================================
           PASSWORD
        ===================================================== */

        .password-row {
            position: relative;

            width: 100%;
        }

        .password-row .input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;

            right: 8px;

            top: 50%;

            transform: translateY(-50%);

            border: 0;

            background: transparent;

            color: var(--muted);

            cursor: pointer;

            font-size: 12px;

            padding: 8px;
        }

        .show-password:hover {
            color: var(--green);
        }


        /* =====================================================
           OPTIONS
        ===================================================== */

        .form-options {
            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            margin: -3px 0 22px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 8px;

            color: var(--muted);

            font-size: 12px;

            min-width: 0;
        }

        .remember input {
            accent-color: var(--green);

            flex-shrink: 0;
        }

        .forgot {
            color: var(--green);

            font-size: 12px;

            white-space: nowrap;
        }

        .forgot:hover {
            text-decoration: underline;
        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .btn {
            display: block;

            width: 100%;

            height: 51px;

            border: 0;

            border-radius: 11px;

            cursor: pointer;

            font-weight: 750;

            font-size: 14px;

            transition:
                transform 0.15s,
                opacity 0.2s,
                background 0.2s;
        }

        .btn-primary {
            background: var(--green);

            color: #041009;
        }

        .btn-primary:hover {
            background: var(--green-hover);

            transform: translateY(-1px);
        }

        .btn:disabled {
            cursor: not-allowed;

            opacity: 0.55;

            transform: none;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {
            display: none;

            width: 100%;

            margin-bottom: 18px;

            padding: 12px 13px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;

            overflow-wrap: anywhere;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(255,95,109,0.08);

            border: 1px solid rgba(255,95,109,0.22);

            color: #ff9da6;
        }

        .message.success {
            background: rgba(25,212,123,0.08);

            border: 1px solid rgba(25,212,123,0.22);

            color: #70e8ad;
        }

        .message.warning {
            background: rgba(245,196,81,0.08);

            border: 1px solid rgba(245,196,81,0.22);

            color: #f5d47c;
        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0;

            color: #5e6964;

            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            flex: 1;

            background: var(--border);
        }


        /* =====================================================
           REGISTER
        ===================================================== */

        .register-text {
            text-align: center;

            color: var(--muted);

            font-size: 13px;

            line-height: 1.6;
        }

        .register-link {
            color: var(--green);

            font-weight: 700;
        }

        .register-link:hover {
            text-decoration: underline;
        }


        /* =====================================================
           SECURITY
        ===================================================== */

        .security {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 7px;

            margin-top: 22px;

            color: #69736f;

            font-size: 11px;

            text-align: center;
        }

        .security-icon {
            color: var(--green);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            width: 100%;

            padding: 20px;

            text-align: center;

            color: #535d59;

            font-size: 11px;
        }


        /* =====================================================
           SPINNER
        ===================================================== */

        .spinner {
            display: inline-block;

            width: 15px;

            height: 15px;

            margin-right: 7px;

            vertical-align: -3px;

            border: 2px solid rgba(0,0,0,0.25);

            border-top-color: #06110b;

            border-radius: 50%;

            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 700px) {

            header {
                min-height: 68px;

                padding: 0 20px;
            }

            .home-link {
                display: none;
            }

            main {
                align-items: flex-start;

                padding:
                    42px 18px 35px;
            }

            .login-heading {
                margin-top: 10px;

                margin-bottom: 22px;
            }

            .login-heading h1 {
                font-size: 30px;
            }

            .login-card {
                padding:
                    26px 21px;

                border-radius: 17px;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            body {
                background:
                    radial-gradient(
                        circle at 50% 0%,
                        rgba(25,212,123,0.08),
                        transparent 32%
                    ),
                    var(--bg);
            }

            header {
                min-height: 64px;

                padding:
                    0 15px;
            }

            .brand {
                font-size: 18px;

                gap: 8px;
            }

            .brand-mark {
                width: 30px;

                height: 30px;

                flex-basis: 30px;

                border-radius: 8px;

                font-size: 15px;
            }

            .header-right {
                gap: 8px;
            }

            .language {
                padding: 3px;
            }

            .lang-btn {
                padding:
                    6px 8px;

                font-size: 11px;
            }

            main {
                width: 100%;

                padding:
                    30px 12px 25px;
            }

            .login-wrapper {
                width: 100%;

                max-width: 100%;
            }

            .login-heading {
                margin-top: 5px;

                margin-bottom: 20px;

                padding: 0 5px;
            }

            .login-heading h1 {
                font-size: 27px;

                letter-spacing: -0.7px;
            }

            .login-heading p {
                font-size: 13px;

                max-width: 330px;

                margin: 0 auto;
            }

            .login-card {
                width: 100%;

                padding:
                    22px 16px;

                border-radius: 16px;
            }

            .form-group {
                margin-bottom: 18px;
            }

            .form-label {
                font-size: 12px;

                margin-bottom: 7px;
            }

            /*
             * 16px prevents iPhone Safari
             * from automatically zooming inputs.
             */

            .input {
                height: 49px;

                padding:
                    0 13px;

                font-size: 16px;
            }

            .password-row .input {
                padding-right: 65px;
            }

            .form-options {
                margin-top: 0;

                margin-bottom: 20px;

                gap: 8px;
            }

            .remember {
                font-size: 11px;
            }

            .forgot {
                font-size: 11px;
            }

            .btn {
                height: 50px;

                font-size: 14px;
            }

            .divider {
                margin: 22px 0;
            }

            .register-text {
                font-size: 12px;
            }

            .security {
                margin-top: 19px;

                font-size: 10px;
            }

            footer {
                padding:
                    16px 12px 20px;

                font-size: 10px;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media (max-width: 360px) {

            header {
                padding:
                    0 11px;
            }

            .brand {
                font-size: 17px;
            }

            .brand-mark {
                width: 28px;

                height: 28px;

                flex-basis: 28px;
            }

            main {
                padding-left: 9px;

                padding-right: 9px;
            }

            .login-card {
                padding-left: 14px;

                padding-right: 14px;
            }

            .form-options {
                flex-wrap: wrap;
            }

            .forgot {
                margin-left: auto;
            }
        }

    </style>
</head>


<body>

<div class="page">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header>

        <a
            href="index.html"
            class="brand"
        >

            <div class="brand-mark">
                C
            </div>

            <span>
                ChatNova
            </span>

        </a>


        <div class="header-right">

            <a
                href="index.html"
                class="home-link"
                data-i18n="backHome"
            >
                ← Back to home
            </a>


            <div class="language">

                <button
                    type="button"
                    class="lang-btn active"
                    id="langEN"
                    onclick="setLanguage('en')"
                >
                    EN
                </button>


                <button
                    type="button"
                    class="lang-btn"
                    id="langZH"
                    onclick="setLanguage('zh')"
                >
                    中文
                </button>

            </div>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ===================================================== -->

    <main>

        <div class="login-wrapper">


            <div class="login-heading">

                <h1 data-i18n="title">
                    Welcome back
                </h1>

                <p data-i18n="subtitle">
                    Sign in to manage your WhatsApp Business accounts.
                </p>

            </div>


            <div class="login-card">


                <!-- MESSAGE -->

                <div
                    id="message"
                    class="message"
                >
                </div>


                <!-- LOGIN FORM -->

                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="email"
                            data-i18n="emailLabel"
                        >
                            Email address
                        </label>


                        <input
                            id="email"
                            class="input"
                            type="email"
                            autocomplete="email"
                            inputmode="email"
                            autocapitalize="none"
                            spellcheck="false"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="password"
                            data-i18n="passwordLabel"
                        >
                            Password
                        </label>


                        <div class="password-row">

                            <input
                                id="password"
                                class="input"
                                type="password"
                                autocomplete="current-password"
                                placeholder="Enter your password"
                                required
                            >


                            <button
                                type="button"
                                class="show-password"
                                id="showPassword"
                                onclick="togglePassword()"
                                data-i18n="show"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- OPTIONS -->

                    <div class="form-options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="remember"
                            >

                            <span data-i18n="remember">
                                Remember me
                            </span>

                        </label>


                        <a
                            href="#"
                            class="forgot"
                            onclick="forgotPassword(event)"
                            data-i18n="forgot"
                        >
                            Forgot password?
                        </a>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="loginButton"
                        data-i18n="signIn"
                    >
                        Sign in
                    </button>

                </form>


                <!-- DIVIDER -->

                <div
                    class="divider"
                    data-i18n="or"
                >
                    OR
                </div>


                <!-- REGISTER -->

                <div class="register-text">

                    <span data-i18n="noAccount">
                        Don't have an account?
                    </span>

                    &nbsp;

                    <a
                        href="register.html"
                        class="register-link"
                        data-i18n="createAccount"
                    >
                        Create account
                    </a>

                </div>


                <!-- SECURITY -->

                <div class="security">

                    <span class="security-icon">
                        ✓
                    </span>

                    <span data-i18n="security">
                        Secure account authentication
                    </span>

                </div>

            </div>

        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer>
        © 2026 ChatNova. All rights reserved.
    </footer>

</div>


<script>

    /* =====================================================
       CHATNOVA CONFIG
    ===================================================== */

    const API_BASE =
        "https://whatsapp-provider-api.b79gn827py.workers.dev";

    const TOKEN_KEY =
        "chatnova_token";

    const USER_KEY =
        "chatnova_user";

    const LANGUAGE_KEY =
        "chatnova_language";


    /* =====================================================
       TRANSLATIONS
    ===================================================== */

    const translations = {

        en: {

            backHome:
                "← Back to home",

            title:
                "Welcome back",

            subtitle:
                "Sign in to manage your WhatsApp Business accounts.",

            emailLabel:
                "Email address",

            passwordLabel:
                "Password",

            show:
                "Show",

            hide:
                "Hide",

            remember:
                "Remember me",

            forgot:
                "Forgot password?",

            signIn:
                "Sign in",

            signingIn:
                "Signing in...",

            or:
                "OR",

            noAccount:
                "Don't have an account?",

            createAccount:
                "Create account",

            security:
                "Secure account authentication",

            invalidLogin:
                "Invalid email or password.",

            connectionError:
                "Unable to connect to ChatNova. Please try again.",

            sessionError:
                "Login succeeded, but the session could not be verified.",

            success:
                "Login successful. Redirecting...",

            forgotMessage:
                "Password recovery will be available soon."

        },


        zh: {

            backHome:
                "← 返回首页",

            title:
                "欢迎回来",

            subtitle:
                "登录以管理您的 WhatsApp Business 账号。",

            emailLabel:
                "电子邮件地址",

            passwordLabel:
                "密码",

            show:
                "显示",

            hide:
                "隐藏",

            remember:
                "记住我",

            forgot:
                "忘记密码？",

            signIn:
                "登录",

            signingIn:
                "登录中...",

            or:
                "或",

            noAccount:
                "还没有账号？",

            createAccount:
                "创建账号",

            security:
                "安全账号认证",

            invalidLogin:
                "电子邮件或密码错误。",

            connectionError:
                "无法连接 ChatNova，请稍后再试。",

            sessionError:
                "登录成功，但无法验证登录会话。",

            success:
                "登录成功，正在进入 Dashboard...",

            forgotMessage:
                "密码恢复功能即将开放。"

        }

    };


    /* =====================================================
       SAFE STORAGE
    ===================================================== */

    function getStorage(
        key,
        fallback = null
    ){

        try {

            const value =
                localStorage.getItem(key);

            return value !== null
                ? value
                : fallback;

        } catch(error) {

            console.warn(
                "ChatNova storage read failed:",
                error
            );

            return fallback;

        }

    }


    function setStorage(
        key,
        value
    ){

        try {

            localStorage.setItem(
                key,
                value
            );

            return true;

        } catch(error) {

            console.warn(
                "ChatNova storage write failed:",
                error
            );

            return false;

        }

    }


    function removeStorage(
        key
    ){

        try {

            localStorage.removeItem(key);

        } catch(error) {

            console.warn(
                "ChatNova storage remove failed:",
                error
            );

        }

    }


    /* =====================================================
       LANGUAGE
    ===================================================== */

    let currentLanguage =
        getStorage(
            LANGUAGE_KEY,
            "en"
        );


    if (
        currentLanguage !== "en" &&
        currentLanguage !== "zh"
    ){

        currentLanguage =
            "en";

    }


    function setLanguage(
        language
    ){

        if (
            language !== "en" &&
            language !== "zh"
        ){

            language = "en";

        }


        currentLanguage =
            language;


        setStorage(
            LANGUAGE_KEY,
            language
        );


        applyLanguage();

    }


    function applyLanguage(){

        const t =
            translations[
                currentLanguage
            ];


        document
            .querySelectorAll(
                "[data-i18n]"
            )
            .forEach(
                element => {

                    const key =
                        element.getAttribute(
                            "data-i18n"
                        );


                    if (
                        t &&
                        t[key]
                    ){

                        element.textContent =
                            t[key];

                    }

                }
            );


        const langEN =
            document.getElementById(
                "langEN"
            );


        const langZH =
            document.getElementById(
                "langZH"
            );


        if(langEN){

            langEN.classList.toggle(
                "active",
                currentLanguage === "en"
            );

        }


        if(langZH){

            langZH.classList.toggle(
                "active",
                currentLanguage === "zh"
            );

        }


        document.documentElement.lang =
            currentLanguage === "zh"
                ? "zh"
                : "en";


        /* Restore password button language */

        const password =
            document.getElementById(
                "password"
            );


        const showPassword =
            document.getElementById(
                "showPassword"
            );


        if(
            password &&
            showPassword
        ){

            showPassword.textContent =
                password.type === "password"
                    ? t.show
                    : t.hide;

        }


        /* Restore login button if not loading */

        const button =
            document.getElementById(
                "loginButton"
            );


        if(
            button &&
            !button.disabled
        ){

            button.textContent =
                t.signIn;

        }

    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showMessage(
        message,
        type = "error"
    ){

        const box =
            document.getElementById(
                "message"
            );


        if(!box){

            return;

        }


        box.textContent =
            message;


        box.className =
            "message show " +
            type;

    }


    function hideMessage(){

        const box =
            document.getElementById(
                "message"
            );


        if(!box){

            return;

        }


        box.className =
            "message";


        box.textContent =
            "";

    }


    /* =====================================================
       PASSWORD VISIBILITY
    ===================================================== */

    function togglePassword(){

        const input =
            document.getElementById(
                "password"
            );


        const button =
            document.getElementById(
                "showPassword"
            );


        if(
            !input ||
            !button
        ){

            return;

        }


        const t =
            translations[
                currentLanguage
            ];


        if(
            input.type ===
            "password"
        ){

            input.type =
                "text";


            button.textContent =
                t.hide;

        }else{

            input.type =
                "password";


            button.textContent =
                t.show;

        }

    }


    /* =====================================================
       FETCH WITH TIMEOUT
    ===================================================== */

    async function fetchWithTimeout(
        url,
        options = {},
        timeout = 15000
    ){

        const controller =
            new AbortController();


        const timer =
            setTimeout(
                () => {

                    controller.abort();

                },
                timeout
            );


        try {

            return await fetch(
                url,
                {
                    ...options,

                    signal:
                        controller.signal,

                    cache:
                        "no-store"
                }
            );

        } finally {

            clearTimeout(timer);

        }

    }


    /* =====================================================
       LOGIN FORM
    ===================================================== */

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    if(loginForm){

        loginForm.addEventListener(
            "submit",
            async function(event){

                event.preventDefault();

                hideMessage();


                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                const button =
                    document.getElementById(
                        "loginButton"
                    );


                if(
                    !email ||
                    !password
                ){

                    return;

                }


                button.disabled =
                    true;


                button.innerHTML =
                    '<span class="spinner"></span>' +
                    translations[
                        currentLanguage
                    ].signingIn;


                try {


                    /* =========================================
                       STEP 1 — LOGIN
                    ========================================= */

                    const loginResponse =
                        await fetchWithTimeout(

                            API_BASE +
                            "/api/login",

                            {
                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Accept":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        email:
                                            email,

                                        password:
                                            password

                                    })

                            },

                            15000

                        );


                    let loginData =
                        null;


                    try {

                        loginData =
                            await loginResponse.json();

                    } catch {

                        loginData =
                            null;

                    }


                    if(
                        !loginResponse.ok ||
                        !loginData ||
                        !loginData.success
                    ){

                        throw new Error(
                            "LOGIN_FAILED"
                        );

                    }


                    /* =========================================
                       STEP 2 — GET TOKEN
                    ========================================= */

                    const token =
                        loginData.token;


                    if(
                        !token ||
                        typeof token !== "string"
                    ){

                        throw new Error(
                            "NO_TOKEN"
                        );

                    }


                    /* =========================================
                       STEP 3 — SAVE TOKEN
                    ========================================= */

                    const tokenSaved =
                        setStorage(
                            TOKEN_KEY,
                            token
                        );


                    if(!tokenSaved){

                        throw new Error(
                            "STORAGE_FAILED"
                        );

                    }


                    /* =========================================
                       STEP 4 — VERIFY TOKEN
                    ========================================= */

                    const meResponse =
                        await fetchWithTimeout(

                            API_BASE +
                            "/api/me",

                            {
                                method:
                                    "GET",

                                headers: {

                                    "Accept":
                                        "application/json",

                                    "Authorization":
                                        "Bearer " +
                                        token

                                }

                            },

                            10000

                        );


                    let meData =
                        null;


                    try {

                        meData =
                            await meResponse.json();

                    } catch {

                        meData =
                            null;

                    }


                    if(
                        !meResponse.ok ||
                        !meData ||
                        !meData.success
                    ){

                        removeStorage(
                            TOKEN_KEY
                        );

                        throw new Error(
                            "SESSION_FAILED"
                        );

                    }


                    /* =========================================
                       STEP 5 — SAVE USER
                    ========================================= */

                    const customer =
                        meData.customer ||
                        meData.user ||
                        null;


                    if(customer){

                        setStorage(
                            USER_KEY,

                            JSON.stringify(
                                customer
                            )
                        );

                    }


                    /* =========================================
                       STEP 6 — SUCCESS
                    ========================================= */

                    showMessage(

                        translations[
                            currentLanguage
                        ].success,

                        "success"

                    );


                    setTimeout(
                        function(){

                            window.location.href =
                                "dashboard.html";

                        },
                        500
                    );


                } catch(error){

                    console.error(
                        "ChatNova login error:",
                        error
                    );


                    removeStorage(
                        TOKEN_KEY
                    );


                    if(
                        error.message ===
                        "LOGIN_FAILED"
                    ){

                        showMessage(

                            translations[
                                currentLanguage
                            ].invalidLogin,

                            "error"

                        );

                    }

                    else if(
                        error.message ===
                        "SESSION_FAILED"
                    ){

                        showMessage(

                            translations[
                                currentLanguage
                            ].sessionError,

                            "error"

                        );

                    }

                    else if(
                        error.message ===
                        "NO_TOKEN"
                    ){

                        showMessage(

                            translations[
                                currentLanguage
                            ].sessionError,

                            "error"

                        );

                    }

                    else if(
                        error.message ===
                        "STORAGE_FAILED"
                    ){

                        showMessage(

                            currentLanguage === "zh"

                                ? "浏览器无法保存登录会话，请检查 Safari 的网站存储设置。"

                                : "Your browser could not save the login session. Please check your browser storage settings.",

                            "warning"

                        );

                    }

                    else{

                        showMessage(

                            translations[
                                currentLanguage
                            ].connectionError,

                            "error"

                        );

                    }


                    button.disabled =
                        false;


                    button.textContent =
                        translations[
                            currentLanguage
                        ].signIn;

                }

            }
        );

    }


    /* =====================================================
       FORGOT PASSWORD
    ===================================================== */

    function forgotPassword(
        event
    ){

        event.preventDefault();


        showMessage(

            translations[
                currentLanguage
            ].forgotMessage,

            "warning"

        );

    }


    /* =====================================================
       CHECK EXISTING SESSION
    ===================================================== */

    async function checkExistingSession(){

        const token =
            getStorage(
                TOKEN_KEY
            );


        if(!token){

            return;

        }


        try{

            const response =
                await fetchWithTimeout(

                    API_BASE +
                    "/api/me",

                    {

                        method:
                            "GET",

                        headers: {

                            "Accept":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                token

                        }

                    },

                    8000

                );


            if(!response.ok){

                removeStorage(
                    TOKEN_KEY
                );

                removeStorage(
                    USER_KEY
                );

                return;

            }


            let data =
                null;


            try{

                data =
                    await response.json();

            }catch{

                data =
                    null;

            }


            if(
                data &&
                data.success
            ){

                const customer =
                    data.customer ||
                    data.user ||
                    null;


                if(customer){

                    setStorage(

                        USER_KEY,

                        JSON.stringify(
                            customer
                        )

                    );

                }


                window.location.href =
                    "dashboard.html";

            }


        }catch(error){

            console.warn(
                "Existing session check skipped:",
                error
            );

        }

    }


    /* =====================================================
       INITIALIZE
    ===================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function(){

            try{

                applyLanguage();

            }catch(error){

                console.error(
                    "Language initialization error:",
                    error
                );

            }


            /*
             * Do not block the login page
             * waiting for old sessions.
             *
             * Session check runs in background.
             */

            checkExistingSession();

        }
    );


    /* =====================================================
       MOBILE SAFETY
    ===================================================== */

    window.addEventListener(
        "pageshow",
        function(event){

            if(event.persisted){

                try{

                    applyLanguage();

                }catch(error){

                    console.warn(
                        "Page restore error:",
                        error
                    );

                }

            }

        }
    );

</script>
