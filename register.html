<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatNova — Create Account</title>

<style>
:root{
  --bg:#080a09;
  --panel:#101311;
  --input:#0b0e0c;
  --border:#202522;
  --text:#f4f7f5;
  --muted:#8b938e;
  --green:#19c37d;
  --green-hover:#22d889;
  --danger:#ff6666;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(25,195,125,.10),
      transparent 38%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px 16px;
}

.container{
  width:100%;
  max-width:500px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:36px;
  height:36px;
  border-radius:10px;
  background:linear-gradient(135deg,#19c37d,#0e9f63);
  color:#06120d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
}

.brand-name{
  font-size:16px;
  font-weight:800;
}

.language{
  display:flex;
  gap:3px;
  padding:4px;
  background:#0d110f;
  border:1px solid var(--border);
  border-radius:10px;
}

.lang{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:7px 11px;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.lang.active{
  background:rgba(25,195,125,.13);
  color:var(--green);
}

.card{
  background:rgba(16,19,17,.97);
  border:1px solid var(--border);
  border-radius:20px;
  padding:34px;
  box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.header{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  width:60px;
  height:60px;
  margin:0 auto 17px;
  border-radius:17px;
  background:linear-gradient(135deg,#19c37d,#0e9f63);
  color:#06120d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:900;
  box-shadow:0 12px 35px rgba(25,195,125,.15);
}

h1{
  font-size:27px;
  line-height:1.2;
  letter-spacing:-.7px;
  margin-bottom:8px;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
}

form{
  display:flex;
  flex-direction:column;
  gap:17px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:8px;
}

label{
  font-size:13px;
  font-weight:700;
  color:#d8dedb;
}

.optional{
  color:#69716c;
  font-weight:500;
  margin-left:4px;
}

input[type="text"],
input[type="email"],
input[type="tel"],
input[type="password"]{
  width:100%;
  height:48px;
  padding:0 14px;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:11px;
  outline:none;
  font-size:14px;
}

input::placeholder{
  color:#59615c;
}

input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(25,195,125,.09);
}

input.invalid{
  border-color:var(--danger);
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:65px;
}

.show-btn{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:var(--muted);
  cursor:pointer;
  font-size:12px;
  font-weight:700;
}

.show-btn:hover{
  color:var(--green);
}

.hint{
  color:#69716c;
  font-size:11px;
}

.message{
  display:none;
  padding:12px 14px;
  border-radius:10px;
  font-size:12px;
  line-height:1.5;
}

.message.error{
  display:block;
  background:rgba(255,102,102,.08);
  border:1px solid rgba(255,102,102,.20);
  color:#ff9090;
}

.message.success{
  display:block;
  background:rgba(25,195,125,.08);
  border:1px solid rgba(25,195,125,.20);
  color:#62e7ac;
}

.terms{
  display:flex;
  align-items:flex-start;
  gap:9px;
}

.terms input{
  width:16px;
  height:16px;
  min-width:16px;
  margin-top:2px;
  accent-color:var(--green);
}

.terms label{
  color:#858e88;
  font-size:11px;
  line-height:1.5;
  font-weight:500;
}

.create-btn{
  width:100%;
  height:50px;
  border:0;
  border-radius:11px;
  background:var(--green);
  color:#06120d;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  margin-top:3px;
}

.create-btn:hover{
  background:var(--green-hover);
}

.create-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.footer{
  text-align:center;
  margin-top:24px;
  padding-top:21px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:13px;
}

.footer a{
  color:var(--green);
  text-decoration:none;
  font-weight:700;
}

.security{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:17px;
  color:#626a65;
  font-size:10px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--green);
}

@media(max-width:520px){
  body{
    align-items:flex-start;
    padding:18px 12px;
  }

  .container{
    margin-top:4px;
  }

  .card{
    padding:25px 20px;
    border-radius:17px;
  }

  h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="topbar">

    <div class="brand">
      <div class="brand-logo">CN</div>
      <div class="brand-name">ChatNova</div>
    </div>

    <div class="language">

      <button
        type="button"
        class="lang"
        id="enBtn"
        onclick="changeLanguage('en')"
      >
        EN
      </button>

      <button
        type="button"
        class="lang"
        id="zhBtn"
        onclick="changeLanguage('zh')"
      >
        中文
      </button>

    </div>

  </div>

  <div class="card">

    <div class="header">

      <div class="logo">CN</div>

      <h1 id="title">
        Create your account
      </h1>

      <p
        class="subtitle"
        id="subtitle"
      >
        Start managing your WhatsApp business communications with ChatNova.
      </p>

    </div>

    <form id="registerForm">

      <div
        id="message"
        class="message"
      ></div>

      <!-- FULL NAME -->

      <div class="field">

        <label
          for="fullName"
          id="fullNameLabel"
        >
          Full Name
        </label>

        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          required
        >

      </div>

      <!-- COMPANY -->

      <div class="field">

        <label for="companyName">

          <span id="companyLabel">
            Company Name
          </span>

          <span
            class="optional"
            id="optionalCompany"
          >
            Optional
          </span>

        </label>

        <input
          type="text"
          id="companyName"
          placeholder="Enter your company name"
        >

      </div>

      <!-- EMAIL -->

      <div class="field">

        <label
          for="email"
          id="emailLabel"
        >
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >

      </div>

      <!-- PHONE -->

      <div class="field">

        <label for="phone">

          <span id="phoneLabel">
            Phone / WhatsApp
          </span>

          <span
            class="optional"
            id="optionalPhone"
          >
            Optional
          </span>

        </label>

        <input
          type="tel"
          id="phone"
          placeholder="+60 12 345 6789"
        >

      </div>

      <!-- PASSWORD -->

      <div class="field">

        <label
          for="password"
          id="passwordLabel"
        >
          Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="8"
            required
          >

          <button
            type="button"
            class="show-btn"
            id="passwordBtn"
            onclick="togglePassword('password','passwordBtn')"
          >
            Show
          </button>

        </div>

        <div
          class="hint"
          id="passwordHint"
        >
          Minimum 8 characters.
        </div>

      </div>

      <!-- CONFIRM PASSWORD -->

      <div class="field">

        <label
          for="confirmPassword"
          id="confirmPasswordLabel"
        >
          Confirm Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            minlength="8"
            required
          >

          <button
            type="button"
            class="show-btn"
            id="confirmPasswordBtn"
            onclick="togglePassword('confirmPassword','confirmPasswordBtn')"
          >
            Show
          </button>

        </div>

      </div>

      <!-- TERMS -->

      <div class="terms">

        <input
          type="checkbox"
          id="terms"
          required
        >

        <label
          for="terms"
          id="termsLabel"
        >
          I agree to use ChatNova in accordance with applicable laws and platform rules.
        </label>

      </div>

      <!-- CREATE ACCOUNT -->

      <button
        type="submit"
        class="create-btn"
        id="createBtn"
      >
        Create Account
      </button>

    </form>

    <div class="footer">

      <span id="alreadyText">
        Already have an account?
      </span>

      &nbsp;

      <a
        href="index.html"
        id="loginLink"
      >
        Login
      </a>

    </div>

    <div class="security">

      <span class="dot"></span>

      <span id="secureText">
        Secure account registration
      </span>

    </div>

  </div>

</div>

<script>

/* =====================================================
   CHATNOVA API
===================================================== */

const API_BASE =
  "https://whatsapp-provider-api.b79gn827py.workers.dev";


/* =====================================================
   TRANSLATIONS
===================================================== */

const EN = {

  title:"Create your account",

  subtitle:
    "Start managing your WhatsApp business communications with ChatNova.",

  fullName:"Full Name",

  fullNamePlaceholder:
    "Enter your full name",

  company:"Company Name",

  companyPlaceholder:
    "Enter your company name",

  optional:"Optional",

  email:"Email Address",

  emailPlaceholder:
    "you@example.com",

  phone:"Phone / WhatsApp",

  phonePlaceholder:
    "+60 12 345 6789",

  password:"Password",

  passwordPlaceholder:
    "Create a password",

  passwordHint:
    "Minimum 8 characters.",

  confirmPassword:
    "Confirm Password",

  confirmPasswordPlaceholder:
    "Confirm your password",

  show:"Show",

  hide:"Hide",

  terms:
    "I agree to use ChatNova in accordance with applicable laws and platform rules.",

  create:"Create Account",

  creating:"Creating Account...",

  already:
    "Already have an account?",

  login:"Login",

  secure:
    "Secure account registration",

  required:
    "Please complete all required fields.",

  invalidEmail:
    "Please enter a valid email address.",

  shortPassword:
    "Password must be at least 8 characters.",

  mismatch:
    "Passwords do not match.",

  acceptTerms:
    "Please accept the terms before creating your account.",

  success:
    "Account created successfully. Redirecting...",

  exists:
    "An account with this email already exists.",

  disabled:
    "This account is disabled.",

  failed:
    "Registration failed. Please try again.",

  network:
    "Unable to connect to ChatNova. Please check your internet connection and try again.",

  server:
    "Server error. Please try again later."

};


const ZH = {

  title:"创建您的账户",

  subtitle:
    "使用 ChatNova 开始管理您的 WhatsApp 商业通讯。",

  fullName:"姓名",

  fullNamePlaceholder:
    "请输入您的姓名",

  company:"公司名称",

  companyPlaceholder:
    "请输入公司名称",

  optional:"可选",

  email:"电子邮箱",

  emailPlaceholder:
    "you@example.com",

  phone:"电话 / WhatsApp",

  phonePlaceholder:
    "+60 12 345 6789",

  password:"密码",

  passwordPlaceholder:
    "创建密码",

  passwordHint:
    "密码至少需要 8 个字符。",

  confirmPassword:"确认密码",

  confirmPasswordPlaceholder:
    "再次输入密码",

  show:"显示",

  hide:"隐藏",

  terms:
    "我同意按照适用法律及平台规则使用 ChatNova。",

  create:"创建账户",

  creating:"正在创建账户...",

  already:"已经有账户？",

  login:"登录",

  secure:"安全账户注册",

  required:
    "请填写所有必填资料。",

  invalidEmail:
    "请输入有效的电子邮箱地址。",

  shortPassword:
    "密码必须至少包含 8 个字符。",

  mismatch:
    "两次输入的密码不一致。",

  acceptTerms:
    "请先同意相关条款，然后创建账户。",

  success:
    "账户创建成功，正在进入系统...",

  exists:
    "这个电子邮箱已经注册过账户。",

  disabled:
    "此账户已被停用。",

  failed:
    "注册失败，请再试一次。",

  network:
    "无法连接 ChatNova，请检查网络连接后再试。",

  server:
    "服务器错误，请稍后再试。"

};


/* =====================================================
   CURRENT LANGUAGE
===================================================== */

let language =
  localStorage.getItem("chatnova_language") || "en";


function getText(){

  return language === "zh"
    ? ZH
    : EN;

}


/* =====================================================
   LANGUAGE SWITCH
===================================================== */

function changeLanguage(newLanguage){

  if(newLanguage !== "en" && newLanguage !== "zh"){
    return;
  }

  language = newLanguage;

  localStorage.setItem(
    "chatnova_language",
    language
  );

  renderLanguage();

}


/* =====================================================
   RENDER LANGUAGE
===================================================== */

function renderLanguage(){

  const t = getText();

  document.documentElement.lang =
    language === "zh"
      ? "zh-CN"
      : "en";

  document.title =
    language === "zh"
      ? "ChatNova — 创建账户"
      : "ChatNova — Create Account";

  document.getElementById("title")
    .textContent = t.title;

  document.getElementById("subtitle")
    .textContent = t.subtitle;

  document.getElementById("fullNameLabel")
    .textContent = t.fullName;

  document.getElementById("companyLabel")
    .textContent = t.company;

  document.getElementById("optionalCompany")
    .textContent = t.optional;

  document.getElementById("emailLabel")
    .textContent = t.email;

  document.getElementById("phoneLabel")
    .textContent = t.phone;

  document.getElementById("optionalPhone")
    .textContent = t.optional;

  document.getElementById("passwordLabel")
    .textContent = t.password;

  document.getElementById("confirmPasswordLabel")
    .textContent = t.confirmPassword;

  document.getElementById("fullName")
    .placeholder =
    t.fullNamePlaceholder;

  document.getElementById("companyName")
    .placeholder =
    t.companyPlaceholder;

  document.getElementById("email")
    .placeholder =
    t.emailPlaceholder;

  document.getElementById("phone")
    .placeholder =
    t.phonePlaceholder;

  document.getElementById("password")
    .placeholder =
    t.passwordPlaceholder;

  document.getElementById("confirmPassword")
    .placeholder =
    t.confirmPasswordPlaceholder;

  document.getElementById("passwordHint")
    .textContent =
    t.passwordHint;

  document.getElementById("termsLabel")
    .textContent =
    t.terms;

  const button =
    document.getElementById("createBtn");

  if(!button.disabled){

    button.textContent =
      t.create;

  }

  document.getElementById("alreadyText")
    .textContent =
    t.already;

  document.getElementById("loginLink")
    .textContent =
    t.login;

  document.getElementById("secureText")
    .textContent =
    t.secure;

  updatePasswordButton(
    "password",
    "passwordBtn"
  );

  updatePasswordButton(
    "confirmPassword",
    "confirmPasswordBtn"
  );

  document.getElementById("enBtn")
    .classList.toggle(
      "active",
      language === "en"
    );

  document.getElementById("zhBtn")
    .classList.toggle(
      "active",
      language === "zh"
    );

}


/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

function togglePassword(
  inputId,
  buttonId
){

  const input =
    document.getElementById(inputId);

  const button =
    document.getElementById(buttonId);

  if(
    input.type === "password"
  ){

    input.type = "text";

    button.textContent =
      getText().hide;

  }else{

    input.type = "password";

    button.textContent =
      getText().show;

  }

}


function updatePasswordButton(
  inputId,
  buttonId
){

  const input =
    document.getElementById(inputId);

  const button =
    document.getElementById(buttonId);

  if(!input || !button){
    return;
  }

  button.textContent =
    input.type === "password"
      ? getText().show
      : getText().hide;

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  type,
  message
){

  const box =
    document.getElementById("message");

  box.className =
    "message " + type;

  box.textContent =
    message;

  box.style.display =
    "block";

}


function clearMessage(){

  const box =
    document.getElementById("message");

  box.className =
    "message";

  box.textContent =
    "";

  box.style.display =
    "none";

}


/* =====================================================
   EMAIL
===================================================== */

function validEmail(email){

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(email);

}


/* =====================================================
   REGISTER
===================================================== */

document
  .getElementById("registerForm")
  .addEventListener(
    "submit",
    registerUser
  );


async function registerUser(event){

  event.preventDefault();

  clearMessage();

  const t =
    getText();

  const fullName =
    document.getElementById("fullName")
      .value
      .trim();

  const companyName =
    document.getElementById("companyName")
      .value
      .trim();

  const email =
    document.getElementById("email")
      .value
      .trim()
      .toLowerCase();

  const phone =
    document.getElementById("phone")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;

  const confirmPassword =
    document.getElementById("confirmPassword")
      .value;

  const terms =
    document.getElementById("terms")
      .checked;

  const button =
    document.getElementById("createBtn");


  /* REQUIRED */

  if(
    !fullName ||
    !email ||
    !password ||
    !confirmPassword
  ){

    showMessage(
      "error",
      t.required
    );

    return;

  }


  /* EMAIL */

  if(!validEmail(email)){

    document
      .getElementById("email")
      .classList.add("invalid");

    showMessage(
      "error",
      t.invalidEmail
    );

    return;

  }


  /* PASSWORD */

  if(password.length < 8){

    document
      .getElementById("password")
      .classList.add("invalid");

    showMessage(
      "error",
      t.shortPassword
    );

    return;

  }


  /* MATCH */

  if(password !== confirmPassword){

    document
      .getElementById("password")
      .classList.add("invalid");

    document
      .getElementById("confirmPassword")
      .classList.add("invalid");

    showMessage(
      "error",
      t.mismatch
    );

    return;

  }


  /* TERMS */

  if(!terms){

    showMessage(
      "error",
      t.acceptTerms
    );

    return;

  }


  /* DISABLE */

  button.disabled = true;

  button.textContent =
    t.creating;


  try{

    const response =
      await fetch(
        API_BASE + "/api/register",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          credentials:"include",

          body:JSON.stringify({

            full_name:
              fullName,

            email:
              email,

            password:
              password,

            phone:
              phone || null,

            company_name:
              companyName || null

          })

        }
      );


    let data = null;


    try{

      data =
        await response.json();

    }catch(error){

      data = null;

    }


    /* SUCCESS */

    if(
      response.ok &&
      data &&
      data.success
    ){

      showMessage(
        "success",
        t.success
      );

      setTimeout(
        function(){

          window.location.href =
            "dashboard.html";

        },
        1000
      );

      return;

    }


    /* ERROR */

    let errorMessage =
      t.failed;


    if(data){

      const serverMessage =
        data.message ||
        data.error ||
        "";

      const lower =
        serverMessage.toLowerCase();


      if(
        lower.includes("already exists") ||
        lower.includes("already registered")
      ){

        errorMessage =
          t.exists;

      }else if(
        lower.includes("disabled")
      ){

        errorMessage =
          t.disabled;

      }else if(
        serverMessage
      ){

        errorMessage =
          serverMessage;

      }

    }


    if(response.status >= 500){

      errorMessage =
        t.server;

    }


    showMessage(
      "error",
      errorMessage
    );


  }catch(error){

    console.error(
      "ChatNova registration error:",
      error
    );

    showMessage(
      "error",
      t.network
    );


  }finally{

    button.disabled = false;

    button.textContent =
      getText().create;

  }

}


/* =====================================================
   REMOVE ERROR BORDER WHILE TYPING
===================================================== */

[
  "fullName",
  "email",
  "password",
  "confirmPassword"
].forEach(function(id){

  document
    .getElementById(id)
    .addEventListener(
      "input",
      function(){

        this.classList.remove(
          "invalid"
        );

      }
    );

});


/* =====================================================
   INITIALIZE
===================================================== */

renderLanguage();

</script>

</body>
</html>
