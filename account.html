<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account - WhatsApp Provider</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            WhatsApp Provider
        </div>


        <nav class="menu">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="whatsapp.html">
                WhatsApp
            </a>

            <a href="chat.html">
                Chat
            </a>

            <a href="billing.html">
                Billing
            </a>

            <a
                href="account.html"
                class="active"
            >
                Account
            </a>

            <a href="#">
                Admin
            </a>

        </nav>


        <button
            class="btn btn-dark"
            onclick="logout()"
        >
            Logout
        </button>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <h2>
                    Account
                </h2>

                <p>
                    Manage your account information
                </p>

            </div>


            <div class="user">

                <span id="userEmail">
                    User
                </span>

            </div>

        </div>



        <!-- PROFILE -->

        <section class="section">

            <h3>
                Profile Information
            </h3>


            <div class="card">

                <div style="width:100%">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Your full name"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <label
                        style="
                            display:block;
                            margin-top:18px;
                        "
                    >
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <label
                        style="
                            display:block;
                            margin-top:18px;
                        "
                    >
                        Phone / WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="+60 12 345 6789"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <label
                        style="
                            display:block;
                            margin-top:18px;
                        "
                    >
                        Company Name
                    </label>

                    <input
                        type="text"
                        id="company"
                        placeholder="Company name"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <button
                        class="btn btn-green"
                        onclick="saveProfile()"
                        style="margin-top:22px;"
                    >
                        Save Changes
                    </button>

                </div>

            </div>

        </section>



        <!-- SECURITY -->

        <section class="section">

            <h3>
                Security
            </h3>


            <div class="card">

                <div style="width:100%">

                    <h3>
                        Change Password
                    </h3>


                    <label
                        style="
                            display:block;
                            margin-top:18px;
                        "
                    >
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Current password"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <label
                        style="
                            display:block;
                            margin-top:18px;
                        "
                    >
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="New password"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <label
                        style="
                            display:block;
                            margin-top:18px;
                        "
                    >
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <button
                        class="btn btn-green"
                        onclick="changePassword()"
                        style="margin-top:22px;"
                    >
                        Update Password
                    </button>

                </div>

            </div>

        </section>



        <!-- ACCOUNT STATUS -->

        <section class="section">

            <h3>
                Account Status
            </h3>


            <div class="card">

                <div>

                    <p class="stat-label">
                        Account
                    </p>

                    <h3>
                        Active
                    </h3>

                    <p>
                        Your account is currently active.
                    </p>

                </div>


                <span class="status connected">
                    ● Active
                </span>

            </div>

        </section>



        <!-- DANGER ZONE -->

        <section class="section">

            <h3>
                Account Actions
            </h3>


            <div class="card">

                <div>

                    <h3>
                        Sign Out
                    </h3>

                    <p>
                        Sign out from this device.
                    </p>

                </div>


                <button
                    class="btn btn-dark"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

        </section>


    </main>

</div>



<script>


/* =========================
   LOAD ACCOUNT
========================= */

const email =
    localStorage.getItem("userEmail");


if (email) {

    document.getElementById(
        "userEmail"
    ).innerText = email;


    document.getElementById(
        "email"
    ).value = email;

}



/* =========================
   LOAD SAVED PROFILE
========================= */

const savedName =
    localStorage.getItem(
        "fullName"
    );

const savedPhone =
    localStorage.getItem(
        "phone"
    );

const savedCompany =
    localStorage.getItem(
        "company"
    );


if (savedName) {

    document.getElementById(
        "fullName"
    ).value = savedName;

}


if (savedPhone) {

    document.getElementById(
        "phone"
    ).value = savedPhone;

}


if (savedCompany) {

    document.getElementById(
        "company"
    ).value = savedCompany;

}



/* =========================
   SAVE PROFILE
========================= */

function saveProfile() {

    const name =
        document.getElementById(
            "fullName"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const company =
        document.getElementById(
            "company"
        ).value.trim();


    localStorage.setItem(
        "fullName",
        name
    );


    localStorage.setItem(
        "phone",
        phone
    );


    localStorage.setItem(
        "company",
        company
    );


    alert(
        "Profile saved successfully."
    );

}



/* =========================
   CHANGE PASSWORD
========================= */

function changePassword() {

    const currentPassword =
        document.getElementById(
            "currentPassword"
        ).value;


    const newPassword =
        document.getElementById(
            "newPassword"
        ).value;


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;


    if (
        !currentPassword ||
        !newPassword ||
        !confirmPassword
    ) {

        alert(
            "Please complete all password fields."
        );

        return;

    }


    if (
        newPassword !==
        confirmPassword
    ) {

        alert(
            "New passwords do not match."
        );

        return;

    }


    if (
        newPassword.length < 8
    ) {

        alert(
            "Password must contain at least 8 characters."
        );

        return;

    }


    alert(
        "Demo only.\n\n" +
        "Password update will later be handled securely by Cloudflare Workers."
    );


    document.getElementById(
        "currentPassword"
    ).value = "";


    document.getElementById(
        "newPassword"
    ).value = "";


    document.getElementById(
        "confirmPassword"
    ).value = "";

}



/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "loggedIn"
    );

    localStorage.removeItem(
        "userEmail"
    );

    window.location.href =
        "index.html";

}


</script>

</body>

</html>
