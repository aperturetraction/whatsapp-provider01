<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account - WhatsApp Provider</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            WhatsApp Provider
        </div>


        <nav class="menu">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="whatsapp.html">
                WhatsApp
            </a>

            <a href="inbox.html">
                Messages
            </a>

            <a href="billing.html">
                Billing
            </a>

            <a
                href="account.html"
                class="active"
            >
                Account
            </a>

        </nav>


        <button
            class="btn btn-dark"
            onclick="logout()"
        >
            Logout
        </button>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <h2>
                    Account
                </h2>

                <p>
                    Manage your account information
                </p>

            </div>


            <div class="user">

                <span id="userEmail">
                    User
                </span>

            </div>

        </div>



        <!-- PROFILE -->

        <section class="section">

            <h3>
                Profile Information
            </h3>


            <div class="card">

                <div style="width:100%">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Your full name"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <label
                        style="
                            display:block;
                            margin-top:18px;
                        "
                    >
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        readonly
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <label
                        style="
                            display:block;
                            margin-top:18px;
                        "
                    >
                        Phone / WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="+60 12 345 6789"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <label
                        style="
                            display:block;
                            margin-top:18px;
                        "
                    >
                        Company Name
                    </label>

                    <input
                        type="text"
                        id="company"
                        placeholder="Company name"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <button
                        class="btn btn-green"
                        onclick="saveProfile()"
                        style="margin-top:22px;"
                    >
                        Save Changes
                    </button>

                </div>

            </div>

        </section>



        <!-- SECURITY -->

        <section class="section">

            <h3>
                Security
            </h3>


            <div class="card">

                <div style="width:100%">

                    <h3>
                        Change Password
                    </h3>


                    <label
                        style="
                            display:block;
                            margin-top:18px;
                        "
                    >
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Current password"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <label
                        style="
                            display:block;
                            margin-top:18px;
                        "
                    >
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="New password"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <label
                        style="
                            display:block;
                            margin-top:18px;
                        "
                    >
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        style="
                            width:100%;
                            padding:13px;
                            margin-top:8px;
                            border:1px solid #d1d5db;
                            border-radius:9px;
                        "
                    >


                    <button
                        class="btn btn-green"
                        onclick="changePassword()"
                        style="margin-top:22px;"
                    >
                        Update Password
                    </button>

                </div>

            </div>

        </section>



        <!-- ACCOUNT STATUS -->

        <section class="section">

            <h3>
                Account Status
            </h3>


            <div class="card">

                <div>

                    <p class="stat-label">
                        Account
                    </p>

                    <h3 id="accountStatus">Checking…</h3>
                    <p id="accessStatus">Checking service access…</p>

                </div>


                <span id="accountStatusBadge" class="status">
                    Checking…
                </span>

            </div>

        </section>



        <!-- DANGER ZONE -->

        <section class="section">

            <h3>
                Account Actions
            </h3>


            <div class="card">

                <div>

                    <h3>
                        Sign Out
                    </h3>

                    <p>
                        Sign out from this device.
                    </p>

                </div>


                <button
                    class="btn btn-dark"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

        </section>


    </main>

</div>



<script>


const API_BASE = "https://whatsapp-provider-api.b79gn827py.workers.dev";
const TOKEN_KEY = "chatnova_token";

async function accountApi(path, options = {}) {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) {
        window.location.replace("login.html");
        throw new Error("Please sign in again.");
    }
    const response = await fetch(`${API_BASE}${path}`, {
        ...options,
        credentials: "include",
        headers: {
            Accept: "application/json",
            Authorization: `Bearer ${token}`,
            ...(options.body ? { "Content-Type": "application/json" } : {}),
            ...options.headers
        }
    });
    const result = await response.json().catch(() => ({}));
    if (response.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        window.location.replace("login.html");
        throw new Error("Your session has expired. Please sign in again.");
    }
    if (!response.ok || result.success === false) {
        throw new Error(result.message || `Request failed (${response.status}).`);
    }
    return result;
}

async function loadAccount() {
    try {
        const [profileResult, meResult] = await Promise.all([
            accountApi("/api/profile"),
            accountApi("/api/me")
        ]);
        const profile = profileResult.profile;
        document.getElementById("userEmail").textContent = profile.email || "Account";
        document.getElementById("email").value = profile.email || "";
        document.getElementById("fullName").value = profile.fullName || "";
        document.getElementById("phone").value = profile.phone || "";
        document.getElementById("company").value = profile.companyName || "";

        const accountStatus = profile.status || "unknown";
        document.getElementById("accountStatus").textContent = accountStatus;
        document.getElementById("accountStatusBadge").textContent = accountStatus;
        document.getElementById("accountStatusBadge").className =
            `status ${accountStatus === "active" ? "connected" : ""}`;
        document.getElementById("accessStatus").textContent =
            `Service access: ${meResult.access?.status || "unknown"}`;
    } catch (error) {
        document.getElementById("accountStatus").textContent = "Unavailable";
        document.getElementById("accountStatusBadge").textContent = "Unavailable";
        document.getElementById("accessStatus").textContent =
            "Unable to load account information.";
        if (localStorage.getItem(TOKEN_KEY)) alert(error.message);
    }
}

async function saveProfile() {
    const button = document.querySelector('[onclick="saveProfile()"]');
    button.disabled = true;
    try {
        const result = await accountApi("/api/profile", {
            method: "PUT",
            body: JSON.stringify({
                fullName: document.getElementById("fullName").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                companyName: document.getElementById("company").value.trim()
            })
        });
        document.getElementById("userEmail").textContent =
            result.profile.email || "Account";
        alert("Profile saved.");
    } catch (error) {
        alert(error.message);
    } finally {
        button.disabled = false;
    }
}

async function changePassword() {
    const currentPassword = document.getElementById("currentPassword").value;
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    if (!currentPassword || !newPassword || !confirmPassword) {
        alert("Please complete all password fields.");
        return;
    }
    if (newPassword !== confirmPassword) {
        alert("New passwords do not match.");
        return;
    }
    if (newPassword.length < 8) {
        alert("Password must contain at least 8 characters.");
        return;
    }
    const button = document.querySelector('[onclick="changePassword()"]');
    button.disabled = true;
    try {
        const result = await accountApi("/api/change-password", {
            method: "POST",
            body: JSON.stringify({ currentPassword, newPassword, confirmPassword })
        });
        for (const key of [TOKEN_KEY, "chatnova_user", "loggedIn", "userEmail"]) {
            localStorage.removeItem(key);
        }
        alert(result.message || "Password changed. Please sign in again.");
        window.location.replace("login.html");
    } catch (error) {
        alert(error.message);
    } finally {
        button.disabled = false;
    }
}

loadAccount();

/* =========================
   LOGOUT
========================= */

async function logout() {
    const token = localStorage.getItem("chatnova_token");
    try {
        await fetch("https://whatsapp-provider-api.b79gn827py.workers.dev/api/logout", {
            method: "POST",
            credentials: "include",
            headers: token ? { Authorization: `Bearer ${token}` } : {}
        });
    } catch {
        console.warn("Server logout could not be confirmed.");
    } finally {
        for (const key of ["chatnova_token", "chatnova_user", "loggedIn", "userEmail"]) {
            localStorage.removeItem(key);
        }
        window.location.replace("login.html");
    }
}


</script>

</body>

</html>
